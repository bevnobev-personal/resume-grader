# Tells Dependabot, GitHub's dependency-update bot, what to watch. It does not
# change anything on its own: it opens pull requests, which then go through CI
# and branch protection like any other change.
#
# Two ecosystems are watched: the actions used by .github/workflows, which go
# stale silently because a tag like @v4 keeps working long after the runtime it
# declares is removed, and the npm packages in package.json.
version: 2

updates:
  - package-ecosystem: github-actions
    # "/" means the repository root, where Dependabot looks for
    # .github/workflows. It does not mean only files directly in the root.
    directory: "/"
    schedule:
      interval: monthly
    # Bundle every action update into one pull request instead of one each.
    # With two actions that is a small difference; it stops being small as a
    # workflow grows.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # Routine minor and patch upgrades arrive together as one pull request,
      # because reviewing them individually is busywork. Major versions are
      # deliberately left out of this group, so each one gets its own pull
      # request: a major can change behaviour, and if it breaks the build the
      # failure should point at a single package rather than a bundle.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
      # Keeps dev-only upgrades distinguishable in the history, since they
      # cannot affect anyone running the tool.
      prefix-development: "deps-dev"
